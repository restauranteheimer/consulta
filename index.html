<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste Webhook</title>
</head>
<body>
    <h2>Teste de Conexão com Webhook</h2>
    <button onclick="testarWebhook()">Testar Conexão</button>
    <button onclick="buscarCliente()">Buscar Cliente (ex: João)</button>
    <pre id="resultado" style="background:#f0f0f0; padding:10px; margin-top:20px;">Resultado aparecerá aqui...</pre>

    <script>
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwxvJxG3ejwk9aBIghVEG5HCAxnCEMvuKK-sE19TpDBaSChKrWyKUZxDLaFj1tA1KfS/exec';
        const resultadoDiv = document.getElementById('resultado');

        async function testarWebhook() {
            resultadoDiv.innerHTML = '🔄 Testando conexão...';
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ test: true })
                });
                const data = await response.json();
                resultadoDiv.innerHTML = '✅ Conexão OK!\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                resultadoDiv.innerHTML = '❌ Erro: ' + error.message;
            }
        }

        async function buscarCliente() {
            const nome = prompt('Digite o nome do cliente para buscar:', 'João');
            if (!nome) return;
            
            resultadoDiv.innerHTML = '🔄 Buscando por: ' + nome + '...';
            try {
                const payload = {
                    queryResult: {
                        queryText: 'buscar ' + nome,
                        intent: { displayName: 'ler_registro' },
                        parameters: { person: nome },
                        languageCode: 'pt-BR'
                    }
                };
                
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                resultadoDiv.innerHTML = '✅ Resposta:\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                resultadoDiv.innerHTML = '❌ Erro: ' + error.message;
            }
        }
    </script>
</body>
</html>
